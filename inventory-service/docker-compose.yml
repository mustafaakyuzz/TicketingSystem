services:
  mysql:
    image: mysql:8.3.0
    container_name: mysql
    restart: always
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql:/var/lib/mysql
      - mysql:/var/log/mysql

volumes:
  mysql: